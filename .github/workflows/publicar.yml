# Publica o app no Firebase Hosting (https://gp2t-gestaodefrota.web.app)
# a cada envio de código. O segredo FIREBASE_SERVICE_ACCOUNT_GP2T é criado
# uma única vez em: Settings -> Secrets and variables -> Actions.
name: Publicar

on:
  push:
    branches:
      - claude/stracta-fleet-mobile-v1-nj63nl
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosting:
    name: Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GP2T }}
          projectId: gp2t-gestaodefrota
          channelId: live
