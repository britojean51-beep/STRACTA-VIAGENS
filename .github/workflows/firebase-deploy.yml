name: Deploy Firebase Hosting

# Publica o app no Firebase Hosting automaticamente a cada mudança
# enviada para a branch de trabalho. Tambem pode ser disparado
# manualmente pela aba "Actions" do GitHub (botao "Run workflow").
#
# Autenticacao: usa uma conta de servico (service account) guardada
# no segredo FIREBASE_SERVICE_ACCOUNT do repositorio.
on:
  push:
    branches:
      - claude/stracta-app-viagens-okctxc
  workflow_dispatch:

jobs:
  deploy:
    name: Build e deploy
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Preparar credencial
        run: printf '%s' "$SA" > "$RUNNER_TEMP/gcp-key.json"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy no Firebase Hosting
        run: firebase deploy --only hosting --project stracta-viagens --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
