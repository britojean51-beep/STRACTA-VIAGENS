name: Deploy Firebase Hosting

# Publica o app no Firebase Hosting automaticamente a cada mudança
# enviada para a branch de trabalho. Tambem pode ser disparado
# manualmente pela aba "Actions" do GitHub (botao "Run workflow").
on:
  push:
    branches:
      - claude/stracta-app-viagens-okctxc
  workflow_dispatch:

jobs:
  deploy:
    name: Build e deploy
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy no Firebase Hosting
        run: firebase deploy --only hosting --project stracta-viagens --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
