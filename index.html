<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>GP2T · Gestão de Frota</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css?v=20260902d" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
</head>
<body>
  <!-- ===== CABEÇALHO ===== -->
  <header class="app-header" id="appHeader">
    <button class="btn-back" id="btnBack" aria-label="Voltar">‹</button>
    <div class="header-titles">
      <h1 class="header-title" id="headerTitle">🚛 STRACTA MINERAÇÃO</h1>
      <p class="header-sub" id="headerSub">CONTROLE DE FROTA</p>
    </div>
    <div class="header-day" id="headerDay">--/--/----</div>
  </header>

  <main id="app"></main>

  <!-- ===== BARRA DE NAVEGAÇÃO INFERIOR ===== -->
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-nav="home"><span>🏠</span>Início</button>
    <button class="tab" data-nav="abastecimento"><span>⛽</span>Abast.</button>
    <button class="tab" data-nav="viagens"><span>🚚</span>Viagens</button>
    <button class="tab" data-nav="relatorio"><span>📋</span>Relatório</button>
    <button class="tab" data-nav="dashboard"><span>📊</span>Painel</button>
  </nav>

  <!-- ===== TOAST / NOTIFICAÇÃO ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== MODAL DE CONFIRMAÇÃO ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <p class="modal-msg" id="modalMsg"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modalCancel">Cancelar</button>
        <button class="btn btn-danger" id="modalConfirm">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Firebase (login). Se não carregar, o app segue funcionando offline. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=20260902d"></script>
  <script src="js/auth.js?v=20260902d"></script>
  <script src="js/storage.js?v=20260902d"></script>
  <script src="js/sync.js?v=20260902d"></script>
  <script src="js/app.js?v=20260902d"></script>
</body>
</html>
